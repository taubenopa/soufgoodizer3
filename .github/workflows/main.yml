name: Build Soufgoodizer + soufinstaller

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build VST3 (Release)
        run: cmake --build build --config Release --target Soufgoodizer_VST3 --parallel

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build soufinstaller.exe
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" soufinstaller.iss'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: soufinstaller
          path: output/soufinstaller.exe

      - name: Upload plain VST3 folder
        uses: actions/upload-artifact@v4
        with:
          name: Soufgoodizer-vst3
          path: build/Soufgoodizer_artefacts/Release/VST3/Soufgoodizer.vst3

      - name: Attach installer to GitHub Release (bei Tags wie v1.0.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/soufinstaller.exe
